name: Verificar Campus Terminal

on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Validar currículo
        run: npm test
      - name: Conferir TypeScript e build
        run: npm run build
